name: one-off-fix-timezone-2026-10

# Runs scripts/fix_review_timezone_2026_10.py once on the stored review files. Same concurrency group as the
# daily job, so the two never overlap. A marker file in the release stops it from running twice.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Repair review times and edited-review copies
        run: |
          if gh release view data --json assets --jq '.assets[].name' | grep -qx tzfix_2026-10.done; then
            echo "already repaired"; exit 0
          fi
          mkdir -p data/raw
          gh release download data --dir data/raw --pattern "reviews_*.parquet"
          uv run python scripts/fix_review_timezone_2026_10.py data/raw
          gh release upload data data/raw/reviews_*.parquet --clobber
          date -u +%Y-%m-%dT%H:%M:%SZ > tzfix_2026-10.done
          gh release upload data tzfix_2026-10.done
