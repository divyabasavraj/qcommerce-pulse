[project]
name = "qpulse"
version = "0.1.0"
description = "Live customer-feedback monitor for India's quick-commerce apps, built on Play Store reviews"
readme = "README.md"
authors = [
    { name = "Divya Basavraj", email = "divyabasavraj54@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "google-play-scraper>=1.2.7",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
